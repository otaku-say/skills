name: 同步上游 CLI 二进制

on:
  repository_dispatch:
    types: [sandbox-cli-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 同步上游 CLI 二进制
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.source_repo == 'otaku-say/sandbox-cli'
    runs-on: ubuntu-latest
    steps:
      - name: 检出技能仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 下载并校验两个架构
        shell: bash
        run: |
          set -euo pipefail
          sh aiod-cli/scripts/update-release.sh --force --arch=both
          sh cube-cli/scripts/update-release.sh --force --arch=both

          (cd aiod-cli/bin && sha256sum -c SHA256SUMS)
          (cd cube-cli/bin && sha256sum -c SHA256SUMS)

          file aiod-cli/bin/amd64/aiod-cli | grep -F 'x86-64'
          file aiod-cli/bin/arm64/aiod-cli | grep -F 'ARM aarch64'
          file cube-cli/bin/amd64/cube-cli | grep -F 'x86-64'
          file cube-cli/bin/arm64/cube-cli | grep -F 'ARM aarch64'
          file aiod-cli/bin/amd64/aiod-cli | grep -F 'statically linked'
          file aiod-cli/bin/arm64/aiod-cli | grep -F 'statically linked'
          file cube-cli/bin/amd64/cube-cli | grep -F 'statically linked'
          file cube-cli/bin/arm64/cube-cli | grep -F 'statically linked'

          aiod-cli/bin/amd64/aiod-cli version
          cube-cli/bin/amd64/cube-cli version

      - name: 仅在内容变化时提交
        shell: bash
        run: |
          set -euo pipefail
          git add \
            aiod-cli/bin/SHA256SUMS \
            aiod-cli/bin/amd64/aiod-cli \
            aiod-cli/bin/arm64/aiod-cli \
            cube-cli/bin/SHA256SUMS \
            cube-cli/bin/amd64/cube-cli \
            cube-cli/bin/arm64/cube-cli

          if git diff --cached --quiet; then
            echo '上游二进制未变化，无需提交。'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '同步上游 CLI 双架构二进制'
          git push origin HEAD:main
