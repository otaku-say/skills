name: 一次性导入 CLI 架构二进制
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main
      - name: 下载校验并提交架构二进制
        shell: bash
        run: |
          set -euo pipefail
          sh aiod-cli/bin/update.sh --force
          sh cube-cli/bin/update.sh --force
          test -x aiod-cli/bin/amd64/aiod-cli
          test -x aiod-cli/bin/arm64/aiod-cli
          test -x cube-cli/bin/amd64/cube-cli
          test -x cube-cli/bin/arm64/cube-cli
          (cd aiod-cli/bin && sha256sum -c SHA256SUMS)
          (cd cube-cli/bin && sha256sum -c SHA256SUMS)
          rm .github/workflows/sync-cli-binaries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aiod-cli/bin/SHA256SUMS aiod-cli/bin/amd64/aiod-cli aiod-cli/bin/arm64/aiod-cli
          git add cube-cli/bin/SHA256SUMS cube-cli/bin/amd64/cube-cli cube-cli/bin/arm64/cube-cli
          git add -u .github/workflows/sync-cli-binaries.yml
          git diff --cached --quiet && { echo "没有需要提交的二进制变更" >&2; exit 1; }
          git commit -m "添加 aiod-cli 和 cube-cli 的双架构二进制"
          git push origin HEAD:main
